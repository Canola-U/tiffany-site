plugins { id 'com.android.application' }
android {
    namespace 'com.tiffanyroom.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tiffanyroom.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    flavorDimensions 'notifications'
    productFlavors {
        preview { dimension 'notifications' }
        push { dimension 'notifications' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if(rootProject.file('.signing/debug.keystore').exists()) {
        signingConfigs { debug { storeFile rootProject.file('.signing/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    }
    buildTypes { debug { debuggable false }; release { minifyEnabled false } }
}

dependencies { pushImplementation 'com.google.firebase:firebase-messaging:24.1.1' }
